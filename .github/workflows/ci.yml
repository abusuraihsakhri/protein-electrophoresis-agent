name: Python and browser regression checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python package and test dependencies
        run: python -m pip install -e '.[api,test]'
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents protein_electrophoresis_agent
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Test browser rule evaluation
        run: node tests/browser_logic.cjs
