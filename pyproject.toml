[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-electrophoresis-engine"
version = "2.0.0"
description = "SpepMind: Serum & Urine Protein Electrophoresis M-Spike Quantifier Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
protein-electrophoresis-engine = "protein_electrophoresis_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/protein-electrophoresis-engine"
Repository = "https://github.com/abusuraihsakhri/protein-electrophoresis-engine.git"
